# Конфигурация xoxo-AntiCheat
#
# Стиль для "messages": фирменные цвета — &9 (синий, для акцентных слов) и &f (белый, для
# всего остального). Стандартный префикс строки — "&f[&9LC&f] " (LC = короткое название сервера).
# Плейсхолдеры %s / %d подставляются по порядку, как описано в комментарии к каждому ключу.

messages:
  prefix: "&f[&9LCAC&f] "

  # Оповещение при КАЖДОМ провале проверки (не только при наказании). Аргументы, в порядке
  # подстановки: игрок, модуль, суффикс счётчика (уже включает ведущий пробел, например " &7x1",
  # либо пустая строка для автобан-путей типа CPS, где отдельного счётчика нет), детали.
  # Пример итоговой строки: "&f[&9LCAC&f] NikitaB3rg провалил проверку &9RotationLockA &7x1 &fПодробнее: Rotation lock across 3 hits (dyaw=0.0000 deg)"
  alert-line: "%s провалил проверку &9%s%s &fПодробнее: %s"

  no-permission: "&cУ вас нет прав на использование этой команды."
  reload-success: "&aКонфигурация перезагружена."

  help-header: "&9&lxoxo-AntiCheat &7— команды:"

  check-header: "&9--- &fСписок вероятных читеров &9---"
  check-empty: "&7Подозрительных игроков сейчас нет."
  # Аргументы: место в списке, игрок, цветовой код, процент подозрения, список последних модулей
  check-line: "%d. %s &f(%s%s%%&f) &7- Последние проверки: %s"

  player-not-online: "&cИгрок &f%s &cсейчас не в сети."

  alert-console: "&cТолько игроки могут переключать оповещения."
  alert-muted: "&7Оповещения о флагах &cвыключены&7. Используйте &f/xoxo alert &7чтобы включить снова."
  alert-enabled: "&7Оповещения о флагах &aвключены&7."
  alert-console-enabled: "&7Запись флагов в консоль &aвключена&7 (режим реального времени)."
  alert-console-disabled: "&7Запись флагов в консоль &cвыключена&7 (тихий режим по умолчанию). Автобаны всё равно логируются и пишутся в JSON."

  unvanish-cleared: "&7Невидимость от GUI проверки &cснята&7."
  unvanish-not-active: "&7У вас сейчас нет активной невидимости от GUI проверки."

  gui-title: "&8Нарушители"

# Основные настраиваемые числа для проверок, которые реально имеет смысл крутить день в день
# (пороги скорости, размеры буферов, дистанции реча, лимиты CPS). Здесь НЕ вынесена каждая
# внутренняя константа каждой проверки — счётчики грейс-тиков для выхода из воды/элитр/нокбэка
# остаются в коде, это внутренняя бухгалтерия, а не то, что реально стоит перенастраивать.
# Поменяйте значения и выполните /xoxo reload — пересборка не нужна.
tuning:
  movement:
    # Максимальная горизонтальная скорость (блоков/тик) при обычной ходьбе, до срабатывания SpeedA.
    # Ванильное значение — ровно 0.42, без всякого запаса. Так как это точная физическая
    # константа без допуска на обычный шум округления (смена направления на доли градуса,
    # погрешность float), поднято до 0.435: подтверждённый репорт показал флаг на 0.43 bpt у
    # игрока сразу после приземления с элитры — на 2% выше номинала, что физически неотличимо
    # от обычного легитимного бега.
    speed-max-bpt: 0.435
    # Максимальная горизонтальная скорость при спринте (спринт ~30% быстрее ходьбы по вики).
    speed-sprint-max-bpt: 0.66
    # Максимальная горизонтальная скорость в первые тики после прыжка во время спринта
    # (sprint-jump). У ванильного sprint-jump пиковая скорость сразу после прыжка заметно выше
    # обычного спринта из-за бонуса ускорения прыжка — именно это раньше ловилось как читы у
    # игроков с копьём/трезубцем, хотя они просто обычно прыгали на бегу.
    speed-sprint-jump-max-bpt: 1.65
    # Сколько тиков после отрыва от земли действует повышенный лимит sprint-jump выше, прежде чем
    # вернуться к обычному лимиту спринта.
    speed-sprint-jump-grace-ticks: 8
    # Дополнительная скорость (блоков/тик) за каждый уровень зелья Speed.
    speed-potion-bonus-per-level: 0.12
    # Максимальная вертикальная скорость во время активного риптайда, выше которой FlyA сработает
    # даже с учётом риптайда (реальный потолок анти-абьюза, отдельно от окна прощения boosted).
    fly-max-riptide-y: 21.5
    # Сколько подряд тиков в воздухе должно пройти, прежде чем FlyA начнёт искать
    # неподдержанный подъём/зависание. Поднято с 8 (~0.4с) до 16 (~0.8с) — 8 оказалось слишком
    # мало для обычного бега по лестницам/неровному рельефу с сетевым джиттером у Bedrock-игроков
    # через GeyserMC: короткие пробежки по краю блоков/спуски с уступов на бегу регулярно давали
    # 8+ тиков подряд "в воздухе" без какого-либо реального нарушения.
    fly-air-ticks-before-flag: 16
    # Сколько подряд провальных тиков (на каждую проверку) должно пройти, прежде чем нарушение
    # движения флагается И позиция игрока откатывается назад. Увеличьте, если легитимных игроков
    # откатывает/дёргает при обычной игре; уменьшите, чтобы наказывать быстрее.
    buffer-to-flag: 3
    # Сколько тиков держится окно прощения для риптайда/рывка копья после последнего срабатывания,
    # и сколько последних тиков ещё считаются "только что сработавшими" для взведения этого окна.
    boost-grace-ticks: 30
    boost-recent-action-ticks: 6

  combat:
    # Максимальный реч ближнего боя в блоках (до допуска) для обычного оружия и для копий.
    reach-max-blocks: 3.7
    reach-max-blocks-spear: 4.9
    # Дополнительный допуск дистанции сверх указанного выше, чтобы компенсировать джиттер
    # сети/хитрегистрации на бедроке.
    reach-leniency: 0.91
    # Минимальное скалярное произведение направления взгляда (0=перпендикулярно, 1=точно в цель),
    # допустимое для легитимной атаки, прежде чем AimAngleA флагнет удар "не глядя". Чем ниже —
    # тем мягче проверка.
    aim-angle-min-dot: 0.19
    # Единый потолок CPS для AutoClickerA — больше нет отдельных мягкого/жёсткого режимов.
    # Превышение этого значения на протяжении autoclicker-buffer-to-punish СЕКУНД подряд ведёт
    # к немедленному кику (см. punishment.overrides.AntiCheat-cps ниже — это ВСЕГДА кик, никогда
    # не бан, так как по CPS одному легко ошибиться).
    autoclicker-enabled: true
    autoclicker-max-cps: 20
    # Поднято с 3 до 5 — при нестабильном соединении (типично для мобильного интернета у
    # Bedrock-игроков) сетевой джиттер может доставить серию кликов пачкой почти одновременно
    # вместо равномерного потока, что даёт ложный кратковременный всплеск CPS даже без изменения
    # реального темпа клика игрока. 5 секунд подряд превышения гораздо надёжнее отличает это от
    # настоящего автокликера.
    autoclicker-buffer-to-punish: 5

# Настройки по каждому модулю. Любой модуль, не перечисленный здесь, использует блок "default" ниже.
# enabled: false полностью отключает модуль (без флагов, без VL, без наказания).
# max-vl: уровень нарушения, при котором срабатывает настроенная команда наказания.
checks:
  default:
    enabled: true
    max-vl: 40

  # Движение
  StepA:
    enabled: true
    max-vl: 18
  FlyA:
    enabled: true
    max-vl: 18
  FlyB:
    enabled: true
    max-vl: 18
  JumpA:
    enabled: true
    max-vl: 16
  SpeedA:
    enabled: true
    max-vl: 18
  BoatFlyA:
    enabled: true
    max-vl: 16

  # Бой
  # Раньше требовалось всего 7 срабатываний, потому что первое же достижение max-vl вело сразу
  # к бану — теперь это обычный kick (см. punishment.overrides.AntiCheat-repeat-movement и
  # комментарий у ReachA.java про сетевую задержку), но 7 всё ещё слишком мало: в реальном PvP
  # несколько срабатываний подряд из-за пинга/движения цели могут набраться за один короткий
  # обмен ударами, что раньше приводило к мгновенному бану, а теперь просто раздражающе часто
  # кикало бы легитимных игроков. Поднято, чтобы требовать более устойчивого паттерна.
  ReachA:
    enabled: true
    max-vl: 20
  # Удары "через стену" — см. NoWallA.java для подробного объяснения подхода (единый луч вдоль
  # реального направления взгляда атакующего, пересекаемый с реальным хитбоксом цели — не
  # сэмплинг фиксированных точек). PvP-only (не применяется к мобам — см. appliesToMobs()),
  # Больше не отменяет сам удар (см. NoWallA.cancelHit() — только флагает/копит VL), поэтому
  # max-vl поднят: раз это больше не мгновенная блокировка, а путь к наказанию, порог должен
  # требовать действительно систематического паттерна, а не пары случайных срабатываний за один
  # близкий бой в тесной геометрии (трапки, сундуки и т.п.).
  NoWallA:
    enabled: true
    max-vl: 25
  # Аналогично больше не отменяет сам удар (см. AimAngleA.cancelHit()) — max-vl поднят по той же
  # причине: кружение в ближнем PvP регулярно даёт единичные всплески угла из-за сетевой
  # задержки, и раз чек больше не блокирует удар мгновенно, порог наказания должен требовать
  # устойчивого паттерна.
  AimAngleA:
    enabled: true
    max-vl: 20
  MultiAuraA:
    enabled: true
    max-vl: 12
  RotationLockA:
    enabled: true
    max-vl: 12
  # AutoClickerA не входит в эту таблицу — он всегда идёт мимо VL/max-vl системы напрямую в
  # punishNow() (см. ViolationManager). Включение/выключение и лимит CPS настраиваются только
  # через tuning.combat.autoclicker-* выше.

# Команды наказания. {player} заменяется точным именем игрока. Все выполняются от лица КОНСОЛИ.
# "default" срабатывает для любого модуля, не перечисленного в "overrides" ниже, когда он
# достигает своего max-vl — сейчас это все проверки, кроме повторных ReachA/FlyA/SpeedA (см. ниже).
#
# Особые случаи (жёстко зашиты в ViolationManager, не настраиваются через max-vl):
#   • ReachA / FlyA / SpeedA — обычный kick на 1-й и 2-й раз; если один и тот же игрок словил кик
#                     по любому из этих трёх модулей суммарно 3 раза за последние 24 часа —
#                     бан по IP на 3-й раз. ReachA раньше банил мгновенно с первого же
#                     срабатывания ("самый сильный сигнал") — это оказалось неверным
#                     решением на практике: сетевая задержка (см. tuning.combat в ReachA.java)
#                     может дать завышенный реч даже в полностью легитимном PvP, и мгновенный
#                     безусловный бан на таком чеке — неприемлемый риск.
#   • AutoClickerA  — превышение CPS-лимита всегда даёт kick (никогда бан), см. tuning.combat выше.
punishment:
  default:
    - "kick {player} Подозрение в читах --sender=LCAC"
  overrides:
    AntiCheat-cps:
      - "kick {player} Подозрение в читах (CPS) --sender=LCAC"
    AntiCheat-repeat-movement:
      - "ban-ip {player} ИП 3.4 Софт --sender=LCAC"
