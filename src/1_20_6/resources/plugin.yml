name: xoxo-AntiCheat
version: '1.0.4'
main: com.xoxoac.XoxoAnticheat
api-version: '1.20'
author: xoxo-AntiCheat Team
description: Bedrock-friendly AntiCheat with a suspects GUI, violation levels and repeat-offense IP bans

commands:
  xoxo:
    description: Main Anticheat Command
    usage: /xoxo <check|reload|alert|unvanish>

permissions:
  xoxoac.bypass:
    description: Full anticheat bypass for the holder — no checks ever run against them. Grant via LuckPerms.
    default: false
  xoxoac.softbypass:
    description: Detection, VL tracking and staff alerts still run normally, but automatic kick/ban punishment is suppressed and logged instead. Intended for trusted staff. Grant via LuckPerms.
    default: false
  xoxoac.helper:
    description: Access to /xoxo check (suspects GUI) and /xoxo alert. Grant via LuckPerms.
    default: false
