punishment:
  default:
    - "kick {player} Подозрение в читах --sender=LCAC"
  overrides:
    AntiCheat-cps:
      - "kick {player} Подозрение в читах (CPS) --sender=LCAC"
    AntiCheat-repeat-movement:
      - "ban-ip {player} ИП 3.4 Софт --sender=LCAC"